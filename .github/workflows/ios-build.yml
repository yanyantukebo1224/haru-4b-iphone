name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iphone:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Haru.xcodeproj \
            -scheme Haru

      - name: Build iPhone app (unsigned)
        run: |
          xcodebuild build \
            -project Haru.xcodeproj \
            -scheme Haru \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HaruDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app artifact
        run: |
          APP="$RUNNER_TEMP/HaruDerivedData/Build/Products/Release-iphoneos/Haru.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Haru-unsigned-app.zip"

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Haru-iPhone-unsigned-app
          path: ${{ runner.temp }}/Haru-unsigned-app.zip
          if-no-files-found: error
          retention-days: 7
